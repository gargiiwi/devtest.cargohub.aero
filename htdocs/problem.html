<html>
<head>
	<title>Experiencing Technical Difficulties</title>
	<style>
	body {
		font-family: Verdana, Geneva, Arial, Helvetica, sans-serif;
		font-size: 12px;
		color: black;
		background: url("/img/above-the-cloud.jpg") no-repeat center center fixed;
		-webkit-background-size: cover;
		-moz-background-size: cover;
		-o-background-size: cover;
		background-size: cover;
	}
	.midscreen {

		margin-top: -350px;
	}
	.recovery {
		background-color:rgba(0, 64, 192, 0.2);

		padding: 10px;
		border-radius: 6px;
	}

	<div class="midscreen">
		<h2 style="text-shadow: 1px 2px 4px white;">We are sorry, it appears we are experiencing technical difficulties</h2>
		<img src="/img/extra/twisted-airplane.png" alt="Twisted Airplane" style="margin: 15px;" />
		<div class="recovery">
			<p>Please fasten your seatbelts and contact technical support at: <a style="color: white; font-size: 120%;" href="mailto:tech@cargohub.nl">tech@cargohub.nl</a></p>
			<h3>The captain is doing everything possible to recover from this situation !</h3>
		</div>
	</div>
