<div id="pwsend">
	<div class="logo left">
		<img src="{html.base}/img/extra/contact-question.png" alt="Send my contact access password" />
	</div>
	<div class="form left">
		<form id="forgot" action="?action=send_contact_password" method="post">
			<h3>Enter your e-mail address to retrieve your password</h3>
			<div class='jqx-rc-all field'><input type='text' name="email" /></div>
			<input type="submit" value="Send password" class="right"/>
			<div class="clear"></div>
		</form>
	</div>
	<div class="clear"></div>
</div>
