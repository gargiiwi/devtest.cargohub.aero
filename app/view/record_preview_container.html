<div class='spacey recordpreview'>
	{#use:tabinfo:<div class='toolbar jqx-widget jqx-rc-all'>
		<div class='toolbar-accessory'>
			<img src='/img/icons/ist/{rt_key}.png' /><span>{rt_name}</span>
		</div>

	</div>}
	{render}
</div>
