{#use:form:<form action="" autocomplete="off" enctype="application/x-www-form-urlencoded" class="issue_form" name="issue_form" method="post">
<table>
	{#use:title:<tr>
		<th><label>{display.label}:</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-input jqx-input-{%jqxtheme} maxlen{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /></td>
	</tr>}
	{#use:ref:<tr>
		<th><label>{display.label}:</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-input jqx-input-{%jqxtheme} medium{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /></td>
	</tr>}
	<tr>
		<th><label>{start.display.label}:</label></th>
		<td>
			{#use:start:<div id='{id}' name='{name}' data-value='{#if:value:{value}~date("Y/M/d")~}' class='calendar left'></div>}
			{#use:end:<span class="left" style="height: 22px; line-height: 22px; margin: 2px 8px;">{display.label}: </span><div id='{id}' name='{name}' data-value='{#if:value:{value}~date("Y/M/d")~}' class='calendar left'></div>}
		</td>
	</tr>
</table>

<hr />
<table>
	<tr>
		<th><label>{code_loc.display.label}:</label></th>
		<td>
			{#use:code_loc:<input type='text' id='{id}' name='{name}' value='{value}' class='left jqx-input jqx-input-{%jqxtheme} medium{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} />}
			{#use:code_iso2:
				<span class="left" style="height: 22px; line-height: 22px; margin: 2px 8px;">{display.label}:</span>
				<select id='{id}' name='{name}' class="left dropselect" data-name='{name}' data-width="100" data-dwidth="100" data-dheight="290" data-filterable="1">
					<option value=''><span>--</span></option>
					{#repeat:options:<option value='{value}'{#if:active: selected='selected'}>{display}</option>
				}</select>
			}
		</td>
	</tr>
	{#use:owner:<tr>
		<th><label>{display.label}:</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-input jqx-input-{%jqxtheme} maxlen{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /></td>
	</tr>}
</table>

{#use:comments:
	<h4>{display.label}</h4>
	<textarea rows="13" id='{id}' name='{name}' class='walloftext jqx-input jqx-input-{%jqxtheme} {#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} style="resize: none; border-width: 1px; width: 99%; margin-bottom: 6px;" placeholder="">{value}</textarea>
}
</form>}
