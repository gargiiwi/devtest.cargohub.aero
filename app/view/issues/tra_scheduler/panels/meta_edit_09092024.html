{#use:form:<form action="" autocomplete="off" enctype="application/x-www-form-urlencoded" class="issue_form" name="issue_form" method="post">
	<table>
	{#use:training_ttl:<tr>
		<th><label>{display.label}:</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-input jqx-input-{%jqxtheme} maxlen{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /></td>
	</tr>} 
	  {#use:place_train:<tr{#if:display.req: class='required'}>
		<th><label>{display.label}:</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-input whitebg jqx-input-{%jqxtheme} maxlen{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /></td>
	</tr>}
	  	{#use:train_loc:<tr>
		<th><label>{display.label}:</label></th>
		<td>{#repeat:options:<label style='display: block; width: 120px; float: left; margin-top: -3px;'><input name='{^name}' type='radio' value='{value}'{#if:active: checked='checked'}> {display}</label>}</td>
	</tr>}
	
	{#use:max_trainee:<tr>
		<th><label>{display.label}:</label></th>
		<td><input type='text' style="width: 50px;" id='{id}' name='{name}' value='{value}' class='jqx-input jqx-input-{%jqxtheme} medium{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /></td>
	</tr>} 
	
	  
  	 {#use:no_train:<tr{#if:display.req: class='required'}>
		<th><label>{display.label}:</label></th>
		<td>
			<!-- 02082024 changes by iwi start-->
			<label>{value}</label>
			<!-- 
				<input type='text' id='{id}' name='{name}' value='{value}' 
				class='jqx-input whitebg jqx-input-{%jqxtheme} maxlen{#if:display.error: field_error}'
				{#if:display.error: data-tooltip='{display.error}'} />
			-->
			<!-- 02082024 changes by iwi end -->
		</td>
	</tr>}
	<!-- 06092024 addded by iwi start -->
	{#use:certificate_expiry:<tr>
		<th><label>{display.label}:</label></th>
		<td>{#repeat:options:<label style='display: block; width: 120px; float: left; margin-top: -3px;'>
			<input name='{^name}' class="certificate_expiry" type='radio' value='{value}'{#if:active: checked='checked'}> {display}</label>}</td>
	</tr>}
	<!-- 06092024 addded by iwi end -->
	  {#use:date_train:<tr{#if:display.req: class='required'}>
		<th><label>{display.label}:</label></th>
		<td><div id='{id}' name='{name}' data-value='{#if:value:{value}~date("Y/m/d")~}' class='calendar left'></div></td>
	</tr>}
	  {#use:date_end:<tr{#if:display.req: class='required'}>
		<th><label>{display.label}:</label></th>
		<td><div id='{id}' name='{name}' data-value='{#if:value:{value}~date("Y/m/d")~}' class='calendar left'></div></td>
	</tr>}
	
	
	 {#use:train_exp:<tr{#if:display.req: class='required'}>
		<th><label>{display.label}:</label></th>
		<td><div id='{id}' name='{name}' data-value='{#if:value:{value}~date("Y/m/d")~}' class='calendar left'></div></td>
	</tr>}
	 
	  {#use:training_remarks:<tr>
		<th><label>Remarks:</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-input jqx-input-{%jqxtheme} maxlen{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /></td>
	</tr>} 
	  
	  
		</table>
		
</form>}
