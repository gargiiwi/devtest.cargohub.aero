<div id="assetReportPage" class="crv-page">
    <div class="crv-wrapper">
        <div class="crv-header">
            <div class="crv-header-left">
                <h2>
                    <i class="fa fa-cubes"></i>
                    Asset Management Report
                </h2>
                <p>
                    Centralized asset monitoring and analytics
                </p>
            </div>
            <div class="ca-header-right">
                 <a href="/issue/list?action=get_supplier_contracts"  class="supplier_report"   title="Supplier Report">
                    <i class="fa fa-users"></i>
                    <span>Supplier Report</span>
                </a>

<a href="/issue/list?action=contracts_analytics" class="contract_analytics"  title="Contract Analytics">
                    <i class="fa fa-bar-chart"></i>
                    <span>Contract Analytics</span>
                </a>

<!--                <a href="/issue/list?action=get_all_assets" class="asset_report"  title="Asset Report">
                    <i class="fa fa-cubes"></i>
                    <span>Asset Report</span>
                </a>-->
            </div>
        </div>

        <div class="crv-filter-section">
            <div class="crv-filter-row">

                <div class="crv-filter-group">
                    <label>Supplier Name</label>
                    <select id="filter_supplier" class="crv-input">
                        <option value="">All Suppliers</option>
                    </select>
                </div>
                <div class="crv-filter-group">
                    <label>Contract Name</label>
                    <select id="filter_contract" class="crv-input">
                        <option value="">All Contract</option>
                    </select>
                </div>

                <div class="crv-filter-group">
                    <label>Asset Type</label>
                    <select id="filter_group" class="crv-input">
                        <option value="">All Type</option>
                    </select>
                </div>
                <div class="crv-filter-group">
                    <label>Contract End Date</label>
                    <select id="filter_end_date" class="crv-input">
                        <option value="">All </option>
                        <option value="0">Ended</option>
                        <option value="30">Upcoming 30 Days</option>
                        <option value="60">Upcoming 60 Days</option>
                        <option value="90">Upcoming 90 Days</option>
                    </select>
                </div>
                <div class="crv-filter-group crv-filter-actions">
                    <button class="crv-btn crv-btn-primary" id="btn_apply_filter">
                        <i class="fa fa-filter"></i>
                        Apply Filter
                    </button>

                    <button class="crv-btn crv-btn-light" id="btn_reset_filter">
                        <i class="fa fa-refresh"></i>
                        Reset
                    </button>
                </div>

            </div>
        </div>

        <div class="crv-kpi-wrapper">

            <div class="crv-kpi-card totalKpiBlock">
                <div class="crv-kpi-head">
                    <span>Total Assets</span>
                    <strong id="kpi_total_assets">0</strong>
                </div>

                <div class="crv-kpi-grid">
                    <div class="kpi-active">
                        <label>Active</label>
                        <b id="kpi_active_assets">0</b>
                    </div>

                    <div class="kpi-closed">
                        <label>Inactive</label>
                        <b id="kpi_inactive_assets">0</b>
                    </div>
                </div>
            </div>

            <div class="crv-kpi-card contractTypeKpiBlock">
                <div class="crv-kpi-head">
                    <span>Service Expiry</span>
                    <strong id="kpi_service_expiry_total">0</strong>
                </div>

                <div class="crv-kpi-grid">
                    <div>
                        <label>expired</label>
                        <b id="kpi_service_expired">0</b>
                    </div>
                    <div>
                        <label>Next 30 Days</label>
                        <b id="kpi_service_expiry_30">0</b>
                    </div>

                    <div>
                        <label> Next 60 Days</label>
                        <b id="kpi_service_expiry_60">0</b>
                    </div>

                    <div>
                        <label>Next 90 Days</label>
                        <b id="kpi_service_expiry_90">0</b>
                    </div>
                </div>
            </div>

            <div class="crv-kpi-card terminationKpiBlock">
                <div class="crv-kpi-head">
                    <span> End Date</span>
                    <strong id="kpi_upcoming_end_date_total">0</strong>
                </div>

                <div class="crv-kpi-grid">
                    <div>
                        <label>Ended</label>
                        <b id="kpi_upcoming_ended">0</b>
                    </div>
                    <div>
                        <label>Next 30 Days</label>
                        <b id="kpi_upcoming_end_date_30">0</b>
                    </div>

                    <div>
                        <label>Next 60 Days</label>
                        <b id="kpi_upcoming_end_date_60">0</b>
                    </div>

                    <div>
                        <label>Next 90 Days</label>
                        <b id="kpi_upcoming_end_date_90">0</b>
                    </div>
                </div>
            </div>

        </div>

        <div class="crv-table-toolbar">

            <div class="crv-toolbar-left">
                <div class="crv-status-filter">
                    <button class="crv-status-btn active" data-status="active">
                        Active
                    </button>

                    <button class="crv-status-btn" data-status="closed">
                        Inactive
                    </button>
                </div>
            </div>

            <div class="crv-toolbar-center">
                <div class="crv-search-box">
                    <i class="fa fa-search"></i>
                    <input type="text" id="asset_search" placeholder="Search asset...">
                </div>
            </div>

            <div class="crv-toolbar-right">
                <button class="crv-btn crv-btn-export">
                    <i class="fa fa-download"></i>
                </button>
            </div>

        </div>

        <div class="crv-table-wrapper">
            <div id="asset_report_table"></div>
        </div>

    </div>
</div>
