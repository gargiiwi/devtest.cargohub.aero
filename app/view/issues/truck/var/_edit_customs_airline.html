{#use:form:<form action="" autocomplete="off" enctype="application/x-www-form-urlencoded" class="issue_form" name="issue_form" method="post">
<table>
	{#use:coll_date:<tr>
		<th><label>{display.label}:{#if:display.req: <span>&nbsp;</span>}</label></th>
		<td><div id='{id}' name='{name}' data-value='{#if:value:{value}~date("Y/M/d")~}' class='calendar'></div></td>
	</tr>}
	{#use:coll_amount:<tr>
		<th><label>{display.label}:{#if:display.req: <span>&nbsp;</span>}</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-input jqx-input-{%jqxtheme} medium' /></td>
	</tr>}
	{#use:coll_risk:<tr>
		<th><label>{display.label}:{#if:display.req: <span>&nbsp;</span>}</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-input jqx-input-{%jqxtheme} medium' /></td>
	</tr>}
	{#use:coll_final:<tr>
		<th><label>{display.label}:{#if:display.req: <span>&nbsp;</span>}</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-input jqx-input-{%jqxtheme} medium' /></td>
	</tr>}
	{#use:procedure:<tr>
		<th><label for='{id}'>{display.label}:{#if:display.req: <span>&nbsp;</span>}</label></th>
		<td><select id='{id}' name='{name}' class='jqx-input jqx-input-{%jqxtheme} medium'>
			<option>Please select:</option>
			{#repeat:options:<option value='{value}'{#if:active: selected='selected'}>{display}</option>
			}
		</select></td>
	</tr>}
</table>
{#use:remarks:
	<h4>{display.label}:</h4>
	<textarea rows="3" id='{id}' name='{name}' class='jqx-input-{%jqxtheme}' style="resize: none; width: 511px; margin-bottom: 8px;" placeholder="(Please keep this information short)">{value}</textarea>
}
</form>}
