{#use:form:<form action="" autocomplete="off" enctype="application/x-www-form-urlencoded" class="issue_form" name="issue_form" method="post">
<table>
	{#use:packing:<tr>
		<th><label for='{id}'>{display.label}:</label></th>
		<td>{#repeat:options:<label><input name='{name}' type='checkbox' value='{value}'{#if:active: checked='checked'}> {display}</label><br />}</td>
	</tr>}
	<tr><td colspan="2"><hr /></td></tr>
	{#use:loose_pieces:<tr>
		<th><label>{display.label}:{#if:display.req: <span>&nbsp;</span>}</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-input jqx-input-{%jqxtheme} medium' /></td>
	</tr>}
	{#use:intact_units:<tr>
		<th><label>{display.label}:{#if:display.req: <span>&nbsp;</span>}</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-input jqx-input-{%jqxtheme} medium' /></td>
	</tr>}
	{#use:pack_weight:<tr>
		<th><label>{display.label}:{#if:display.req: <span>&nbsp;</span>}</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-input jqx-input-{%jqxtheme} medium' /> kg</td>
	</tr>}
	{#use:total_volume:<tr>
		<th><label>{display.label}:{#if:display.req: <span>&nbsp;</span>}</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-input jqx-input-{%jqxtheme} medium' /> m3</td>
	</tr>}
	{#use:trucktype:<tr>
		<th><label>{display.label}:{#if:display.req: <span>&nbsp;</span>}</label></th>
		<td>{#repeat:options:<label style='display: block; width: 120px; float: left; margin-top: -3px;'><input name='{^name}' type='radio' value='{value}'{#if:active: checked='checked'}> {display}</label>}</td>		
	</tr>}
</table>
</form>}
