{#use:form:<form action="" autocomplete="off" enctype="application/x-www-form-urlencoded" class="issue_form" name="issue_form" method="post">
	<table>
	<tr>{!MAWB line}
		<th><label for='{mawb_p.id}'>{mawb_p.display.label}:</label></th>
		<td>
			<input type='text' id='{mawb_p.id}' name='{mawb_p.name}' value='{mawb_p.value}' maxlength="3" style='width: 30px;' class="jqx-input whitebg jqx-input-{%jqxtheme} only-numbers" /> - 
			<input type='text' id='{mawb_s.id}' name='{mawb_s.name}' value='{mawb_s.value}' maxlength="8" style='width: 70px;' class="jqx-input whitebg jqx-input-{%jqxtheme} only-numbers" />
		</td>
	</tr>
	
	<tr>{#use:dest_loc:
		<th><label>{display.label}:</label></th>
		<td><div data-id='#{id}' data-sourceurl='?action=suggest_airport' class='searchbox' data-width='348'></div>
			<input type="hidden" id="{id}" name="{name}" value="{value}" />}
			{#use:dest_loc_text:<input type="hidden" id="{id}" name="{name}" value="{value}" />}
		</td>
	</tr>
	<tr style="height: 50px;">
		<th style="width: 150px; text-align: left;"><label>{incoterm.display.label}:</label></th>
		<td>
			{#use:incoterm:
				<select id='{id}' name='{name}' class="left dropselect" data-name='{name}' data-width="250" data-dwidth="250" data-dheight="290" data-filterable="1" >
					<option value=''><span>--</span></option>
					{#repeat:options:<option value='{value}'{#if:active: selected='selected'}>{display}</option>}
				</select>
			}
		</td>
	</tr>

	{#use:hawb:<tr class="">
		<th><label for='{id}'>{display.label}:</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-rc-all jqx-input jqx-input-{%jqxtheme} maxlen{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /></td>
	</tr>}

	{#use:job_nr:<tr class="">
		<th><label for='{id}'>{display.label}:</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-rc-all jqx-input jqx-input-{%jqxtheme} maxlen{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /></td>
	</tr>}

	{#use:wms_nr:<tr class="">
		<th><label for='{id}'>{display.label}:</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-rc-all jqx-input jqx-input-{%jqxtheme} maxlen{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /></td>
	</tr>}

	{#use:shipper:<tr class="">
		<th><label for='{id}'>{display.label}:</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-rc-all jqx-input jqx-input-{%jqxtheme} maxlen{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /></td>
	</tr>}

	{#use:consignee:<tr class="">
		<th><label for='{id}'>{display.label}:</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-rc-all jqx-input jqx-input-{%jqxtheme} maxlen{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /></td>
	</tr>}

	{#use:reference:<tr class="">
		<th><label for='{id}'>{display.label}:</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-rc-all jqx-input jqx-input-{%jqxtheme} maxlen{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /></td>
	</tr>}
	
	
	<tr>{#use:pieces:
			<th><label>{display.label}:</label></th>
			<td><input type='text' id='{id}' name='{name}' value='{value}' style = 'width:208px;'class='jqx-input jqx-input-{%jqxtheme} tiny only-numbers{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /> pcs</td>}
	</tr> 
	
	<tr>{#use:g_weight:
			<th><label>{display.label}:</label></th>
			<td><input type='text' id='{id}' name='{name}' value='{value}' style = 'width:208px;' class='jqx-input jqx-input-{%jqxtheme} tiny only-numbers{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /> pcs</td>}
	</tr> 
	<tr>{#use:v_weight:
			<th><label>{display.label}:</label></th>
			<td><input type='text' id='{id}' name='{name}' value='{value}' style = 'width:208px;'  class='jqx-input jqx-input-{%jqxtheme} tiny only-numbers{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /> pcs</td>}
	</tr> 
	
	

	

	
	</table>
    	{#use:dims:
		<h4 style="text-indent: -3px; margin-top: 12px;">{display.label}: {#if:display.req: <span>&nbsp;</span>}</h4>
		<textarea rows="7" id='{id}' name='{name}' class='jqx-input jqx-input-{%jqxtheme} {#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} style="resize: none; border-width: 1px; width: 542px; margin-bottom: 16px;" placeholder="(Please keep this information short)">{value}</textarea>
	   }


</form>
}
