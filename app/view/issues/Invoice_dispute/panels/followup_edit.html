{#use:form:<form action="" autocomplete="off" enctype="application/x-www-form-urlencoded" class="issue_form" name="issue_form" method="post">
	
<table>
     	
     
	
   {#use:val_yn:<tr>
		<th><label>{display.label}</label></th>
		<td>{#repeat:options:<label style='display: block; width: 120px; float: left; margin-top: -3px;'><input name='{^name}' type='radio' value="{value}"{#if:active: checked='checked'}> {display}</label>}</td>
	</tr>}
  
   {#use:date_close:<tr>
	<th><label for='{id}'>{display.label}</label></th>
	<td><div id='{id}' name='{name}' data-value='{#if:value:{value}~date("Y/m/d")~}' class='calendar'></div></td>
</tr>}
 
  <tr>{#use:ae_rem:
		<th><label for='{id}'>{display.label}:</label></th>
		<td><select id='{id}' name='{name}' class="dropselect" data-width="350" data-dwidth="350" data-dheight="300">
			<option value=''>---</option>
			{#repeat:options:<option value='{value}'{#if:active: selected='selected'}>{display}</option>}
		</select></td>
	}</tr>
  
    <tr>{#use:cca:
		<th><label for='{id}'>{display.label}:</label></th>
		<td><select id='{id}' name='{name}' class="dropselect" data-width="350" data-dwidth="350" data-dheight="300">
			<option value=''>---</option>
			{#repeat:options:<option value='{value}'{#if:active: selected='selected'}>{display}</option>}
		</select></td>
	}</tr>
  
  
  
  
  
  
   {#use:rad_rem:<tr>
	  <th><label for='{id}'>{display.label}</label></th>
	  <td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-input jqx-input-{%jqxtheme} long{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /></td>
  </tr>}
  
 
  
  {#use:await_con:<tr>
		<th><label for='{id}'>{display.label}</label></th>
		<td>{#repeat:options:<label style='display: block; width: 120px; float: left; margin-top: -3px;'><input name='{^name}' type='radio' value="{value}"{#if:active: checked='checked'}> {display}</label>}</td>
	</tr>}
     
   
   <tr>{#use:c_rate:
	<th><label for='{id}'>{display.label}</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' style='width: 105px;' class='jqx-input jqx-input-{%jqxtheme} tiny only-numbers{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /></td>}
</tr>}
  
</table>


</form>
