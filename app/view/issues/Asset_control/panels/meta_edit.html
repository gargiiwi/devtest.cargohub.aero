{#use:form:<form action="" autocomplete="off" enctype="application/x-www-form-urlencoded" class="issue_form" name="issue_form" method="post">
	<table>
	{#use:title:<tr>
		<th><label>{display.label}:</label></th>
		<td>
			<input type='text' id='{id}' name='{name}' value='{value}' 
			class='jqx-input jqx-input-{%jqxtheme} maxlen{#if:display.error: field_error}'
			{#if:display.error: data-tooltip='{display.error}'} />	
		</td>
	</tr>} 
	{#use:b_name:<tr>
		<th><label>{display.label}:</label></th>
		<td>
			<input type='text' id='{id}' name='{name}' value='{value}' 
			class='jqx-input jqx-input-{%jqxtheme} maxlen{#if:display.error: field_error}'
			{#if:display.error: data-tooltip='{display.error}'} />	
		</td>
	</tr>} 
	  {#use:reference:<tr>
		<th><label>{display.label}:</label></th>
		<td>
			<input type='text' id='{id}' name='{name}' value='{value}'

			{#if:display.error: data-tooltip='{display.error}'} />	
		</td>
	</tr>} 
	{#use:m_date:<tr>
	<th><label for='{id}'>{display.label}:</label></th>
	<td><div id='{id}' name='{name}' data-value='{#if:value:{value}~date("Y/m/d")~}' class='calendar'></div></td>
	</tr>}
	{#use:s_no:<tr>

	</tr>}

		</tr>}

		</tr>}

		</tr>}

		</tr>}

	<td><div id='{id}' name='{name}' data-value='{#if:value:{value}~date("Y/m/d")~}' class='calendar'></div></td>
	</tr>}
		
	{#use:service_expiry:<tr>

	<td><div id='{id}' name='{name}' data-value='{#if:value:{value}~date("Y/m/d")~}' class='calendar'></div></td>
	</tr>}

</form>}
