{#use:form:<form action="" autocomplete="off" enctype="application/x-www-form-urlencoded" class="issue_form" name="issue_form" method="post">
<table>
	{#use:section:<tr>
		<th><label>{display.label}:</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-rc-all whitebg maxlen jqx-input jqx-input-{%jqxtheme}{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /></td>
	</tr>}
	<tr>
		<th><label>{chapter.display.label}:</label></th>
		<td>
			{#use:chp_no:<input type='text' id='{id}' name='{name}' value='{value}' class='center jqx-rc-all whitebg short jqx-input jqx-input-{%jqxtheme}{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} />}
			{#use:chapter:<input style="margin-right: 15px; width: 250px;" type='text' id='{id}' name='{name}' value='{value}' class='right center jqx-rc-all whitebg jqx-input jqx-input-{%jqxtheme}{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} />}
		</td>
	</tr>
	{#use:title:<tr>
		<th><label>Title / Short version:</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-rc-all whitebg maxlen jqx-input jqx-input-{%jqxtheme}{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /></td>
	</tr>}
	{#use:rev:<tr>
		<th><label>Revision:</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-rc-all whitebg short jqx-input jqx-input-{%jqxtheme}{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /></td>
	</tr>}
</table>
	{#use:question:
		<h5>Assessment question:</h5>
		<textarea rows="25" id='{id}' name='{name}' class='jqx-rc-all whitebg jqx-input jqx-input-{%jqxtheme} {#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} style="resize: vertical; overflow: auto; border-width: 1px; width: 535px; margin-bottom: 16px;">{value}</textarea>
	}
	{#use:expla:
		<h5>Question explanation:</h5>
		<textarea rows="15" id='{id}' name='{name}' class='jqx-rc-all whitebg jqx-input jqx-input-{%jqxtheme} {#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} style="resize: vertical; overflow: auto; border-width: 1px; width: 535px; margin-bottom: 16px;">{value}</textarea>
	}
<table>
	{#use:reference:<tr>
		<th><label for='{id}'>{display.label}:</label></th>
		<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-input jqx-input-{%jqxtheme} maxlen{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /></td>
	</tr>}
</table>
}
