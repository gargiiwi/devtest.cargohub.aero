{#use:form:<form action="" autocomplete="off" enctype="application/x-www-form-urlencoded" class="issue_form" name="issue_form" method="post">
	<table>
		<tr>
			<th><label for='{id}'>{crdi_no.display.label}:</label></th>
			<td>
				{#use:crdi_no:<input type='text' id='{id}' name='{name}' value='{value}' class='left jqx-rc-all jqx-input jqx-input-{%jqxtheme} long{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} />}
				{#use:crdi_date:<span class="left" style="height: 25px; line-height: 25px; margin: 0 5px;">Date:</span>
					<div id='{id}' name='{name}' data-value='{#if:value:{value}~date("Y/M/d")~}' class='calendar left'>}
			</td>
		</tr>
		{#use:crdi_amt:<tr>
			<th><label for='{id}'>{display.label}:</label></th>
			<td><input type='text' id='{id}' name='{name}' value='{value}' class='left jqx-rc-all jqx-input jqx-input-{%jqxtheme} only-numbers medium{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} />}
				{#use:crdi_amt_curr:<select id='{id}' name='{name}' style='float: left; margin-left: 5px; width: 80px; font-family: monospace; height: 22px;' class='currency_select_secondary whitebg jqx-rc-all jqx-input jqx-input-{%jqxtheme}'>
					<option value='' selected='selected' hidden='hidden'>Select:</option>
					{#repeat:options:<option value='{value}'{#if:active: selected='selected'}>{display}</option>
					}
				</select>}
			</td>
		</tr>
		{#use:chgbk_amt:<tr>
			<th><label for='{id}'>{display.label}:</label></th>
			<td><input type='text' id='{id}' name='{name}' value='{value}' class='left jqx-rc-all jqx-input jqx-input-{%jqxtheme} only-numbers medium{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} />}
				{#use:chgbk_amt_curr:<select id='{id}' name='{name}' style='float: left; margin-left: 5px; width: 80px; font-family: monospace; height: 22px;' class='currency_select_secondary whitebg jqx-rc-all jqx-input jqx-input-{%jqxtheme}'>
					<option value='' selected='selected' hidden='hidden'>Select:</option>
					{#repeat:options:<option value='{value}'{#if:active: selected='selected'}>{display}</option>
					}
				</select>}
			</td>
		</tr>
		{#use:chgbk_to:<tr>
			<th><label for='{id}'>{display.label}:</label></th>
			<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-rc-all jqx-input jqx-input-{%jqxtheme} maxlen{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /></td>
		</tr>}
	</table>
	{#use:remarksf:
		<h5>{display.label}:</h5>
		<textarea autocorrect="off" spellcheck="false" rows="7" id='{id}' name='{name}' class='walloftext jqx-input jqx-input-{%jqxtheme} {#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} style="resize: none; border-width: 1px; width: 99%; margin-bottom: 1px; margin-bottom: 6px;" placeholder="">{value}</textarea>
	}
</form>}
