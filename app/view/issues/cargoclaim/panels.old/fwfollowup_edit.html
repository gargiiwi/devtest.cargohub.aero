{#use:form:<form action="" autocomplete="off" enctype="application/x-www-form-urlencoded" class="issue_form" name="issue_form" method="post">
	<h4>Investigation:</h4>
	<table>
		{#use:fw_cause:<tr>
			<th><label for='{id}'>{display.label}:</label></th>
			<td><input type='text' id='{id}' name='{name}' value='{value}' class='jqx-input jqx-input-{%jqxtheme} maxlen{#if:display.error: field_error}'{#if:display.error: data-tooltip='{display.error}'} /></td>
		</tr>}
		<tr>{#use:fw_caused_by:
			<th><label for='{id}'>{display.label}:</label></th>
			<td><select id='{id}' name='{name}'>
				<option value=''>(select)</option>
				{#repeat:options:<option value='{value}'{#if:active: selected='selected'}>{display}</option>}
			</select></td>
		}</tr>
		<tr><th><label>{fw_irreg_code.display.label}:</label></th><td>
			{#use:fw_irreg_code:<select class="dropselect multi-select left" data-name='{name}' data-width="180" data-dwidth="220" data-dheight="224" data-dalign="left" data-filterable="1" id='{id}'>
				{#repeat:options:<option value='{value}'{#if:active: data-checked='1'}>{display}</option>}
			</select>}
		</td></tr>
		<tr>{#use:fw_liable:
			<th><label for='{id}'>{display.label}:</label></th>
			<td>{#repeat:options:<label style='display: block; width: 120px; float: left; margin-top: -3px;'><input name='{^name}' type='radio' value='{value}'{#if:active: checked='checked'}> {display}</label>}</td>
		}</tr>
		<tr>{#use:fw_involved:
			<th><label for='{id}'>{display.label}:</label></th>
			<td>{#repeat:options:<label style='display: block; width: 120px; float: left; margin-top: -3px;'><input name='{^name}' type='radio' value='{value}'{#if:active: checked='checked'}> {display}</label>}</td>
		}</tr>
	</table>
	<hr />
	{#use:fw_findings:<div style="padding: 6px;"><label for='{id}'>{display.label}:</label>
		<textarea style='width: 99%;' rows="7" id='{id}' name='{name}'{#if:display.error: class='field_error' data-tooltip='{display.error}'}>{value}</textarea>
	</div>}
	{#use:fw_actions_taken:<div style="padding: 6px;"><label for='{id}'>{display.label}:</label>
		<textarea style='width: 99%;' rows="7" id='{id}' name='{name}'{#if:display.error: class='field_error' data-tooltip='{display.error}'}>{value}</textarea>
	</div>}
	{#use:fw_outcome:<div style="padding: 6px;"><label for='{id}'>{display.label}:</label>
		<textarea style='width: 99%;' rows="7" id='{id}' name='{name}'{#if:display.error: class='field_error' data-tooltip='{display.error}'}>{value}</textarea>
	</div>}
}
