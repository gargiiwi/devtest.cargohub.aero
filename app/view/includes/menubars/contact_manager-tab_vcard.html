<button data-op="tab-search" title="Back to list"><img src="/img/icons16/arrow_undo.png" alt="back" /> Back to search</button>
<button data-op="vcard-close" title="Close contact" id="vcard-close"><img src="/img/icons16/cross.png" alt="close" /> Close</button>
<button data-op="vcard-save" id="contact-save-button" title="Save" data-disabled="yes"><img src="/img/icons16/save.png" alt="Save" /> Save</button>
<div id="ops-vcard_existing" style="display: none;">
	<div class="toolbar-separator"></div>
	<div id="ops-issue_target" style="display: none;">
		<button data-op="issue-target" title="Set contact as issue target"><img src="/img/icons16/commlabel/issue_target.png" alt="Target" /> Issue target</button>
	</div>
{!	<button data-op="set-label" title="Set label for contact"><img src="/img/icons16/tag_orange.png" alt="Tag" /> Set label</button>}
	<button data-op="vcard-delete" title="Remove this contact from the database"><img src="/img/icons16/vcard_delete.png" alt="Delete" /> Delete</button>
</div>
