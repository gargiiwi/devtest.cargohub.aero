<div class="opbar" id="ops-label_selected" style="display: none;">
	<button data-op="vcard-add" title="Create new contact"><img src="/img/icons16/vcard_add.png" alt="Add" /> New contact</button>
	<button data-op="refresh" title="Refresh contacts"><img src="/img/icons16/arrow_refresh.png" alt="Refresh" /> Refresh</button>
	<div class="toolbar-separator"></div>
	{!Toolbar buttons that are shown when only one single basic contact is clicked in the datatable}
	<div id="ops-basiccon_single_select" style="display: none;">
		<button id="op-details" data-op="details" title="Details about selected contact"><img src="/img/icons16/vcard.png" alt="Details" /> Details</button>
	</div>
	{!Toolbar buttons shown when one or multiple standard conversations are selected in the datatable}
	<div id="ops-basiccon_any_select" style="display: none;">
		{!<button data-op="set-label" title="Set label for one or more contacts"><img src="/img/icons16/commlabel/tag_orange.png" alt="Tag" /> Set label</button>}
		<button data-op="delete" title="Delete one or more contacts"><img src="/img/icons16/delete.png" alt="Delete" /> Delete</button>
		<div class="toolbar-separator"></div>
	</div>
</div>
{!<button data-op="manage-labels" title="Manage labels"><img src="/img/icons16/commlabel/tag_green.png" alt="Tag" /> Manage labels</button>}
