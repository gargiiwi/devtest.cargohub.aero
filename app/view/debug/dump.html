<!-- The plain-HTML dump template; TODO: A better "dump" template -->
<pre style='clear: both; background: #F5F5F5; border: 1px solid brown; padding: 10px; position: relative; z-index: 9999; font-size: 13px; text-align: left;'>
{#if:label:<span style='color: brown; font-family: Verdana; font-size:16px; display: block; padding-bottom: 2px; margin-bottom: 10px; border-bottom: 1px solid brown;'>{time}{label}</span>}
{var_dump}
</pre>
{@<style>
.mark {
	background-color: black;
	color: white;
}
</style>}{#if:show_source:
<table style='border: 1px solid black; background-color: white; width: 100%;'>
<tr><td width="30" align="right"><pre>{#repeat:line_numbers:{$}.
}</pre></td><td>{source}</td></tr>
</table>}
