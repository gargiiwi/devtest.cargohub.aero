    <button  title="Publication Access" style="float: right;" class="raumd jqx-rc-all jqx-rc-all-classic jqx-button jqx-button-classic jqx-widget jqx-widget-classic jqx-fill-state-normal jqx-fill-state-normal-classic">

        <li><img src='/img/icons16/company-building-icon.png' alt='Active' /> Publication Active</li><!-- comment -->

    <div class='spacey' id="active" >

                    <th>Email</th>
                    <th>Departments</th>
                    <!--<th></th>-->

                </tr>
            </thead>
            <tbody>
                {#repeat:users_active: <tr>

                    <td>{dep_name}</td>

                    <td>
                         <button id="edit_btn" class="btn raallow"  data-user-id="{id}" >Edit</button>
                        {#if:is_publish_all_linked_department='Yes':
                        <button id="disallow_btn" class="btn radisallow"  data-user-id="{id}" >Click to Disallow</button>
                        }
                        
                        
                         
                    </td>
                </tr>}

            </tbody>
        </table>


    </div>
    
    <div class='spacey' id="notActive" >

                    <!--<td>{is_publish_all_linked_department}</td>-->

                        }
                    </td>-->
                    <td>
                        {#if:is_publish_all_linked_department='No':
                        <button id="allow_btn" class="btn raallow" data-user-id="{id}">Click to Allow</button>
                        }
                        
                    </td>
                </tr>}

            </tbody>
        </table>


    </div>
