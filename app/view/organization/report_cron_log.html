<div class="reportCronLogSec">
    <section class="its-tbl-sec">
        <div class="container-fluid">
            <div class="its-slt-div">
                <a href="/manager/organization?id={orgid}&reportcron" class="plus-1" >
                    <span><i class="fa fa-arrow-left" aria-hidden="true"></i></span>
                </a>

 
            </div>
            <div class="its-tbl-div">
                <table class="table">
                    <thead>
                        <tr>
                            <th>User Name</th>
                            <th>Date</th>
                            <th>File</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {#repeat:getAllLogData:
                        <tr id="trSec_{id}">
                            <td>{user_name}</td>
                            <td>{created_at}</td>
                            <td>{file_path}</td>                            
                            <td>
                                <div style="display: flex; align-items: center;">
                                    <a href="{folder_path}/{file_path}" download>
                                        <span class="tb-blue">
                                            <i class="fa fa-download" aria-hidden="true" data-id="5"></i>
                                        </span>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        }
                    </tbody>
                </table>
            </div>
        </div>
    </section>
    
</div>
