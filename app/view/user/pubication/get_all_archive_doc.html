<div style="padding-top: 20px;" id="" class="get_all_read_sign_div_section ">

        </div>
        <div>
            <img class="log_pub" style="" alt="" src="{orgLogo}">
        </div>
    </div>
    <div>


        <div class="ratabs">
            <div class="simple-spinner">
                <span></span> 
            </div>

            <div>
