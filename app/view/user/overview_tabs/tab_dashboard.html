    <div id="todo-popup" class="todo-popup">
    <div class="todo-popup-overlay"></div>
    <div class="todo-popup-box">
        <div class="todo-popup-header">
            <div class="todo-popup-title">
                <i class="fa fa-check-square-o"></i>
                <span id="todo-popup-heading">Add Todo</span>
            </div>
            <a href="javascript:void(0)"
               class="todo-popup-close"
               onclick="closeTodoPopup();">
                <i class="fa fa-times"></i>
            </a>
        </div>

        <div class="todo-popup-body">
            <input type="hidden" id="todo-id" value="">
            <div class="todo-form-group">
                <label>Title</label>
                <input type="text"
                       id="todo-title-input"
                       class="todo-form-input"
                       placeholder="Enter task title">
            </div>
            <div class="todo-form-row">
                <div class="todo-form-group">
                    <label>Due Date</label>
                    <input type="date"
                           id="todo-date-input"
                           class="todo-form-input"
                           placeholder="DD-MM-YYYY">
                </div>
                <div class="todo-form-group">
                    <label>Priority</label>
                    <select id="todo-priority-input"
                            class="todo-form-input">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
            </div>
            <div class="todo-form-group">
                <label>Description</label>
                <textarea id="todo-description-input"
                          class="todo-form-input todo-form-textarea"
                          placeholder="Add description"></textarea>
            </div>
            
            <div class="todo-form-group">
                <label>Closing Remark</label>
                <textarea id="todo-remark-input" class="todo-form-input todo-form-textarea" placeholder="Add remark"></textarea>
            </div>
        </div>
        <div class="todo-popup-footer">
            <button type="button"
                    id="todo-delete-btn"
                    class="todo-delete-btn"
                    onclick="deleteTodo();">
                <i class="fa fa-trash-o"></i>
                Delete
            </button>
            <div class="todo-popup-actions">
                <button type="button"
                        class="todo-cancel-btn"
                        onclick="closeTodoPopup();">
                    Cancel
                </button>
                <button type="button"
                        class="todo-save-btn"
                        onclick="saveTodo();">
                    <i class="fa fa-check"></i>
                    <span id="todo-save-text">Add Todo</span>
                </button>
            </div>
        </div>
    </div>
</div>
   <!--IWI new dashboard design 17082026 end-->
