<div class='toolbar jqx-widget jqx-rc-all'><div class='longjohnson'>
	<div class='toolbar-accessory'>
		<img src="/img/icons/messages.png" /><span>Messages</span>
	</div>		

	<div id='messages-rowops' style='display: none;'>
		<button data-op='view' title="View message"><img src='/img/icons16/eye.png' /> View message</button>
		<button data-op='link' title="Open link"><img src='/img/icons16/link.png' /> Open link</button>
	</div>
	
	<button class='right' data-op="grid-state-reset" title="Reset grid to default"><img src='/img/icons16/recycle.png' />Reset grid</button>
</div></div>
<div id="messages-grid"></div>

<br /><div class='info-expander'>
	<div>Global messages search (click to open/close)</div>
	<div class='spacey'>
		<h3>All message records can be viewed and searched here.</h3>
		<p>It's possible to locate a message by it's ID, and for record-linked messages also open the record from where it was sent</p>
	</div>
</div>
