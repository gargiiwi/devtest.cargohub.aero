# The name and short name of the organization type. Appended beside the name of the organization when using partnership functions 
name: Superhero café
shortname: Admin
disallowcreate: true

# CSV list of controllers (without the App_Ctrl_ prefix) that this organization type has access to
controllers:
  - user_overview # This is also the "Home" controller, the one that the user gets redirected to when not having access to a module and attempting to access it
  - user_commcenter # The communication center handles e-mails and messages
  - user_settings # User settings and preferences ( Moving user settings, profile controls and other not-so-used features to new module )
  - global_operations
  - global_contact
  - global_note
  - global_task
  - global_comm # Centralized e-mail / communication API - All modules which need to send something will plug into this
  - manager_organization
  - manager_department
  - manager_user # Admin and organization manager for users
  - manager_contacts # Contacts manager (personal, department, organization, global)
  - manager_tasks # All tasks accessible by the user - Replaces "issue_tasks"
  - issue_list
  - issue_listexport
  - issue_item
  - record_make # New module replacing public "submit" (One must always be logged in to create records, even if it's free-create account)
  - record_process # Complete control over record information ( tab-based )
  - record_view # Clean view of record data
  - record_print # Open a full page TinyMCE containing the record + selected print template ( or the default if none specified )
  - record_edit # Full edit mode for records (big form, no panels)
  - record_gate
  - search_global # Global list/search for records (all types). Used to locate records of any kinds
  - issue_tasks
  - issue_reports
  - admin_center
  - admin_maintenance
  - admin_dashboard # Will get replaced once Center is finished
  - admin_orgs
  - admin_users
  - admin_contacts
  - admin_groups
  - admin_templates
  - admin_cmsys
  - admin_updates
  - admin_rtlist
  - admin_rtedit
  - admin_settings
  - admin_messages
  - admin_sysdata
  - admin_log
  - contact_account
  - contact_operations
  - datasource_exchange
  - user_publication #publication read only 
  - issue_capa
  - record_reports

mainmenu:
  -
    name: Cockpit
    icon: cockpit.png
    access: Yes
    route: "/user/overview#dashboard"
  -
    name: Records Grid
    icon: table.png
    access: Yes
    route: /issue/list
  -
    name: Charts
    icon: chart_bar.png
    access: Yes
    route: "/user/overview#modules"
  -
    name: Tasks
    icon: to_do_list_checked_1.png
    access: Yes
    route: /manager/tasks:record
  -
    name: Organization
    icon: company-building-icon.png
    access: Yes
    route: "/manager/organization#overview"
  -
    name: Contacts
    icon: book_addresses.png 
    access: Yes
    route: /manager/contacts
  -
    name: Notifications
    icon: bell.png
    access: Yes
    route: "/user/overview#notify"
  -
    name: Settings
    icon: cog.png
    access: Yes
    route: /user/settings
  -
    name: Currency Exchange
    icon: exchange.png
    access: Yes
    route: /datasource/exchange
  -
    name: Admin Center
    icon: superman.png
    access: Yes
    route: /admin/center

# While these exist, they serve no purpose here, as there will always be only ONE "admin" type organization
default_features:
  abilities:
    - omniscient
    - omnipotent
    - omnipresent

default_privileges:

default_access_ids:

# Issue Type Overrides for this type of organization (Base ID: Override ID) - The same method applies for higher level overrides (org, dep, user)
ist_or: